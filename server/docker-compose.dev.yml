services:
  api:
    container_name: devtinder-api-dev
    build: 
      context: .
      target: dev
    command: npm run dev
    environment:
      NODE_ENV: development
    ports:
      - "3000:3000"

  worker:
    container_name: devtinder-worker-dev
    build:
      context: .
      target: dev
    command: npm run worker
    environment:
      NODE_ENV: development

  postgres:
    container_name: devtinder-postgres-dev
    ports:
      - "5434:5432"
  redis:
    container_name: devtinder-redis-dev
    ports:
      - "6379:6379"
