name: CI

on:
  push:
    branches:
      - main
concurrency:
  group: production-deployment
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
env:
  IMAGE_TAG: ${{ github.sha }}
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: devtinder_test
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d devtinder_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 0
      CLIENT_URL: http://localhost:5173
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/devtinder_test
      REDIS_URL: redis://localhost:6379/1
      SALT_ROUNDS: 10
      RESEND_API_KEY: ci-test-resend-key
      ACCESS_TOKEN_SECRET: ci-test-access-token-secret-at-least-32-characters
      DUMMY_HASH: $2b$10$abcdefghijklmnopqrstuuQw8K.5bCvSnx79PZ3hqYgdd04hC6PaZTW
      CSRF_TOKEN_SECRET: ci-test-csrf-token-secret-at-least-32-characters
      ACCESS_TOKEN_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      VOYAGE_API_KEY: ci-test-voyage-key
      OAUTH_TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GOOGLE_CLIENT_ID: ci-test-google-client-id
      GOOGLE_CLIENT_SECRET: ci-test-google-client-secret
      GOOGLE_REDIRECT_URI: http://localhost:3000/v1/oauth/google/callback
      GITHUB_CLIENT_ID: ci-test-github-client-id
      GITHUB_CLIENT_SECRET: ci-test-github-client-secret
      GITHUB_REDIRECT_URI: http://localhost:3000/v1/oauth/github/callback
      GITHUB_CONNECT_REDIRECT_URI: http://localhost:3000/v1/oauth/github/connect/callback

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Seed integration-test reference data
        run: npx --no-install tsx src/db/seeds/seed.prod.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ${{ env.REGISTRY }}/devtinder-server:${{ env.IMAGE_TAG }}

  build-and-push-frontend:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NGINX_CONFIG=nginx.prod.conf
          tags: ${{ env.REGISTRY }}/devtinder-frontend:${{ env.IMAGE_TAG }}
  deploy-test:
    needs:
      - test
      - build-and-push
      - build-and-push-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -e
          
            # 1. Login first
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin
          
            # 2. Set vars
            export IMAGE_TAG=${{ github.sha }}
            export REGISTRY=ghcr.io/${{ github.repository_owner }}
          
            # 3. Pull code
            cd /home/azureuser/app/DevTinder
            git pull --ff-only origin main
          
            # 4. Pull images
            cd server
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
          
            # 5. Run (migration happens automatically via depends_on)
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
          
            # 6. Health check
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T api wget -qO- http://localhost:3000/health
          
            echo "Deployed: ${IMAGE_TAG}"
