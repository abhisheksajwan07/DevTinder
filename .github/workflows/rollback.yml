name: Rollback

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'SHA tag to rollback to'
        required: true

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy previous image
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -e

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin

            export IMAGE_TAG=${{ github.event.inputs.image_tag }}
            export REGISTRY=ghcr.io/${{ github.repository_owner }}

            cd /home/azureuser/app/DevTinder/server

            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T api wget -qO- http://localhost:3000/health

            echo "Rolled back to: ${IMAGE_TAG}"